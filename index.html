<style>
/* Layout: one phone-width column. Deep-leaf header band, marigold only for the single most important action or marker.
   Display = Baloo Tamma 2 (Kannada + Latin, rounded like painted market signboards). Body = Noto Sans Kannada/Devanagari. */
:root{
  --bg:#F1F5EE; --card:#FFFFFF; --ink:#10261A; --mute:#566B5D; --line:#DAE4D6;
  --brand:#17603F; --brand-ink:#FFFFFF; --hdr:#0E3F2A; --hdr-ink:#F3FAF4; --hdr-mute:#A9C9B6;
  --mari:#F4B01D; --mari-ink:#2A1C00;
  --good:#1B8049; --goodbg:#DDF1E3; --mid:#9A6A00; --midbg:#FBEFCB; --low:#BE3228; --lowbg:#F9DEDA; --info:#245F94; --infobg:#DCEAF6;
  --field:#F7FAF5; --shadow:0 1px 2px rgba(16,38,26,.06),0 6px 18px rgba(16,38,26,.07);
  --f-d:'Baloo Tamma 2','Noto Sans Kannada','Noto Sans Devanagari',system-ui,sans-serif;
  --f-b:'Noto Sans Kannada','Noto Sans Devanagari','Noto Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1810; --card:#13271B; --ink:#E7F1E9; --mute:#9BB2A3; --line:#244034;
  --brand:#3DB87A; --brand-ink:#05170D; --hdr:#0F2A1D; --hdr-ink:#EAF6EC; --hdr-mute:#8FB09C;
  --good:#58C98A; --goodbg:#16392A; --mid:#E7B84A; --midbg:#3A3012; --low:#F08A80; --lowbg:#40201D; --info:#7DB4E6; --infobg:#17304A;
  --field:#0F2017; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1810; --card:#13271B; --ink:#E7F1E9; --mute:#9BB2A3; --line:#244034;
  --brand:#3DB87A; --brand-ink:#05170D; --hdr:#0F2A1D; --hdr-ink:#EAF6EC; --hdr-mute:#8FB09C;
  --good:#58C98A; --goodbg:#16392A; --mid:#E7B84A; --midbg:#3A3012; --low:#F08A80; --lowbg:#40201D; --info:#7DB4E6; --infobg:#17304A;
  --field:#0F2017; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.5;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--mari);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:460px;margin:0 auto;min-height:100%;position:relative;background:var(--bg)}
@media (min-width:520px){body{background:color-mix(in srgb,var(--bg) 70%,#000 6%)}#app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.18)}}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:30px;font-weight:800}h2{font-size:22px;font-weight:700}h3{font-size:18px;font-weight:700}
.mute{color:var(--mute)}.sm{font-size:14px}.xs{font-size:12.5px}

/* language chips */
.langs{display:flex;gap:6px}
.langs button{min-width:36px;height:32px;padding:0 8px;border-radius:17px;font-size:14px;font-weight:700;color:var(--hdr-ink);border:1.5px solid color-mix(in srgb,var(--hdr-ink) 35%,transparent)}
.langs button[aria-pressed="true"]{background:var(--mari);border-color:var(--mari);color:var(--mari-ink)}
.langs.light button{color:var(--ink);border-color:var(--line)}
.langs.light button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* welcome / login */
.hero{background:var(--hdr);color:var(--hdr-ink);padding-block:max(14px,env(safe-area-inset-top,0px)) 0;position:relative;overflow:hidden}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-weight:800;font-size:22px}
.brand svg{width:34px;height:34px;flex:none}
.hero h1{margin-top:22px;font-size:32px}
.hero p{margin:6px 0 0;color:var(--hdr-mute);font-size:15px}
.hero svg.art{display:block;width:100%;height:auto;margin-top:6px}
.sheetcard{background:var(--card);border-radius:24px 24px 0 0;margin-top:-22px;position:relative;padding-top:22px;padding-bottom:24px;min-height:340px;box-shadow:0 -8px 24px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lab{font-weight:700;font-size:14.5px}
.inp{min-width:0;display:flex;align-items:center;gap:8px;min-height:54px;border:2px solid var(--line);background:var(--field);border-radius:14px;padding:0 14px}
.inp:focus-within{border-color:var(--brand)}
.inp.err{border-color:var(--low);background:var(--lowbg)}
.inp.ok{border-color:var(--good)}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;border:0;background:none;outline:0;font-size:18px;padding:0;min-height:48px}
.inp textarea{padding:10px 0;resize:none;font-size:16px}
.inp select{appearance:none;-webkit-appearance:none}
.inp .pre{font-weight:700;color:var(--mute);border-right:2px solid var(--line);padding-right:10px}
.inp .tick{width:22px;height:22px;flex:none;color:var(--good);opacity:0}
.inp.ok .tick{opacity:1}
.inp.sel::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--mute);border-bottom:2.5px solid var(--mute);transform:rotate(45deg) translateY(-3px);flex:none}
.inp:has(select:disabled){opacity:.55}
.msg{font-size:13.5px;min-height:0;display:none;gap:6px;align-items:flex-start;line-height:1.4}
.msg.show{display:flex}
.msg.e{color:var(--low)}
.msg.big{font-size:17px;font-weight:700;line-height:1.5;background:#FDECEA;border-radius:12px;padding:10px 12px;margin-top:8px}.msg.big svg{width:20px;height:20px;margin-top:3px}.msg.w{color:var(--mid)}.msg.i{color:var(--info)}
.msg svg{width:16px;height:16px;flex:none;margin-top:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:16px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:18px;font-family:var(--f-d);transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.mari{background:var(--mari);color:var(--mari-ink)}
.btn.ghost{background:none;border:2px solid var(--line);color:var(--ink)}
.btn.regblink{border-color:#F4B01D;animation:regb 1.4s ease-in-out infinite}
.btn.regblink.hard{animation-duration:.7s}
@keyframes regb{0%,100%{background:#FFF8E1;border-color:#F4B01D;box-shadow:0 0 0 0 rgba(244,176,29,.0)}50%{background:#F4B01D;border-color:#E09A00;box-shadow:0 0 0 6px rgba(244,176,29,.35)}}
@media (prefers-reduced-motion:reduce){.btn.regblink{animation:none;background:#F4B01D}}
.btn.link{background:none;color:var(--brand);min-height:44px;font-size:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.frozen{opacity:.35;filter:grayscale(1);box-shadow:none}
.btn.busy{opacity:.75;pointer-events:none}
.btn.busy::before{content:"";width:20px;height:20px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
.btn.done{background:var(--good);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.lockline{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--infobg);color:var(--info);border-radius:14px;font-size:14px;margin:16px 0}
.lockline svg{width:22px;height:22px;flex:none}
.pendbar{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;font-size:14px;margin:14px 0 0;background:var(--infobg);color:var(--info)}
.pendbar.off,.pendbar.weak{background:color-mix(in srgb,var(--low) 10%,var(--bg));color:var(--low)}
.pendbar svg{width:22px;height:22px;flex:none}.pendbar .btn{flex:none;width:auto;padding:8px 12px;min-height:0;font-size:13.5px}
.demo{font-size:13.5px;color:var(--mute);text-align:center;margin-top:10px}
.demo b{color:var(--ink);font-family:var(--f-d);letter-spacing:.5px}
.codeboxes{display:flex;gap:8px;justify-content:space-between;margin:6px 0 4px}
.codeboxes input{width:100%;min-width:0;height:58px;text-align:center;font-size:24px;font-weight:700;border:2px solid var(--line);border-radius:14px;background:var(--field);outline:0}
.codeboxes input:focus{border-color:var(--brand)}
.codeboxes.err input{border-color:var(--low);background:var(--lowbg)}

/* wizard */
.wiz-top{display:flex;align-items:center;gap:12px;padding-block:max(12px,env(safe-area-inset-top,0px)) 8px;background:var(--bg);position:sticky;top:0;z-index:5}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;border:2px solid var(--line);background:var(--card)}
.iconbtn svg{width:22px;height:22px}
.prog{flex:1}
.prog .bar{display:flex;gap:6px}
.prog .bar i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.prog .bar i.on{background:var(--brand)}
.prog .bar i.cur{background:var(--mari)}
.prog small{display:block;margin-top:5px;color:var(--mute);font-size:13px}
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.role{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:14px;border-radius:18px;background:var(--card);border:2px solid var(--line);min-height:104px;font-weight:700;font-size:15px;line-height:1.3}
.role .ic{width:42px;height:42px;border-radius:13px;background:var(--goodbg);color:var(--good);display:grid;place-items:center}
.role .ic svg{width:26px;height:26px}
.role[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--card));box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.role[aria-pressed="true"] .ic{background:var(--brand);color:var(--brand-ink)}
.area2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.area2>div{min-width:0}
.sub{font-size:13px;color:var(--mute);font-weight:500}
.stepper{display:flex;align-items:stretch;gap:8px}
.stepper button{width:54px;min-height:54px;border-radius:14px;background:var(--goodbg);color:var(--good);font-size:28px;font-weight:700;font-family:var(--f-d);line-height:1}
.stepper .inp{flex:1}
.stepper .inp input{text-align:center;font-weight:700;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 16px;border-radius:23px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15.5px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip.sm2{min-height:40px;padding:0 13px;font-size:14.5px}
.summ{background:var(--goodbg);color:var(--good);border-radius:14px;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.summ b{font-family:var(--f-d);font-size:20px}
.success{text-align:center;padding:30px 0}
.success .big{width:92px;height:92px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;margin:0 auto 16px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.success .big svg{width:48px;height:48px}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* dashboard */
.dh{background:var(--hdr);color:var(--hdr-ink);padding-block:max(12px,env(safe-area-inset-top,0px)) 74px}
.dh .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--mari);color:var(--mari-ink);display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:22px;flex:none}
.who h2{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--hdr-mute);display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .uname{font-size:22px;line-height:1.3;margin:10px 0 2px;overflow-wrap:anywhere;word-break:break-word}
.dh .usub{display:block;color:var(--hdr-mute);font-size:13.5px;line-height:1.4}
.rolepill{margin-top:12px;display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:16px;background:color-mix(in srgb,var(--hdr-ink) 14%,transparent);font-size:13.5px;font-weight:700}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--hdr-mute);margin-left:8px}
.net i{width:8px;height:8px;border-radius:50%;background:#5AD38E}
.net.off i{background:var(--mari)}
.net.off,.net.weak{color:#ffb4ab;font-weight:700}.net.off i,.net.weak i{background:#ff6b5e}.net.chk i{background:var(--hdr-mute)}
#netbar{position:sticky;top:0;z-index:55}
.netbar{display:flex;gap:10px;align-items:flex-start;padding:10px 12px 10px 14px;background:color-mix(in srgb,var(--low) 10%,var(--bg));color:var(--low);border-bottom:2px solid var(--low);font-size:14px;line-height:1.45}
.netbar svg{width:22px;height:22px;flex:none;margin-top:1px}
.tag2{display:block;margin:14px 0 12px;padding:12px 16px;border-radius:14px;background:#FFF4D6;color:#0E3F2A;font-size:18px;font-weight:800;line-height:1.45;border-left:6px solid #F4B01D;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.instcard{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);margin-bottom:14px}
.instcard .ic{width:48px;height:48px;flex:none;border-radius:12px}.instcard .x{flex:none;color:var(--mute);padding:4px;align-self:flex-start}
.pendrow{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--infobg);color:var(--info);font-size:13.5px;font-weight:700;border-bottom:1px solid var(--line)}
.pendrow.bad{background:color-mix(in srgb,var(--low) 10%,var(--bg));color:var(--low)}
.pendrow svg{width:20px;height:20px;flex:none}.pbtn{flex:none;border:1.5px solid currentColor;border-radius:10px;padding:5px 10px;font-weight:700;font-size:13px;color:inherit;background:none}.netbar b{font-size:15px}.netbar .x{flex:none;color:inherit;padding:2px;margin-left:auto}
.main{margin-top:-58px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;min-height:40px;padding:0 16px;border-radius:20px;font-weight:700;font-size:15px;background:var(--field);border:2px solid var(--line)}
.tabs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pricebox{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.price{font-family:var(--f-d);font-weight:800;font-size:52px;line-height:1;letter-spacing:-1px}
.price small{font-size:17px;font-weight:600;color:var(--mute);letter-spacing:0;margin-left:4px}
.trend{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:15px;font-weight:700;font-size:14px}
.trend.up{background:var(--goodbg);color:var(--good)}.trend.down{background:var(--lowbg);color:var(--low)}.trend.flat{background:var(--midbg);color:var(--mid)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:14px;font-weight:700;font-size:14px}
.pill.g{background:var(--goodbg);color:var(--good)}.pill.m{background:var(--midbg);color:var(--mid)}.pill.l{background:var(--lowbg);color:var(--low)}
.chartwrap{margin-top:10px}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.chartwrap text{font-family:var(--f-b);fill:var(--mute);font-size:11px}
.bestline{margin-top:10px;display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--mari) 22%,var(--card));border-radius:14px;padding:10px 12px;font-size:14.5px}
.bestline b{font-family:var(--f-d);font-size:18px}
.sechead{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.sechead a,.sechead button{color:var(--brand);font-weight:700;font-size:14.5px;min-height:36px}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);border-left:6px solid var(--info);width:100%;text-align:left}
.alert.w{border-left-color:var(--mari)}.alert.c{border-left-color:var(--low)}.alert.g{border-left-color:var(--good)}
.alert svg{width:22px;height:22px;flex:none;margin-top:2px}
.alert.w svg{color:var(--mid)}.alert.c svg{color:var(--low)}.alert.i svg{color:var(--info)}.alert.g svg{color:var(--good)}
.alert p{margin:0;font-size:15px;line-height:1.45}.alert small{color:var(--mute)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.q{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:13px;line-height:1.25;text-align:center;min-width:0}

function deva(s){ let o = ''; for (const ch of s) { const c = ch.codePointAt(0); if (c >= 0xC80 && c <= 0xCFF) { let x = c - 0xC80 + 0x900; x = ({0x946:0x947, 0x90E:0x90F, 0x912:0x913, 0x94A:0x94B})[x] || x; if (LANG === 'hi' && x === 0x933) x = 0x932; o += String.fromCodePoint(x); } else o += ch; }
  return o.replace(/[\u094d\u0941](?=$|[\s\-(])/g, '').replace(/\u093f(?=$|[\s\-(])/g, '\u0940').replace('(पट्टण)', '(शहर)'); }
const pnm = kn => { if (!kn || LANG === 'kn' || kn === NOH) return kn || ''; const o = PLN[kn]; if (o && o[LANG]) return o[LANG]; return LANG === 'en' ? kn : deva(kn); };
const pnSort = arr => arr.slice().sort((a, b) => pnm(a).localeCompare(pnm(b), LANG));
const popts = (arr, val) => pnSort(arr).map(x => `<option value="${esc(x)}" ${x===val?'selected':''}>${esc(pnm(x))}</option>`).join('');
/* no hobli in the forms: the villages of a taluk, and the (hidden) hobli a village sits in */
function vilsOf(d, tl){ const T = d && tl && PLACES[d] && PLACES[d][tl]; return T ? [...new Set(Object.values(T).flat())] : []; }
function hobOf(d, tl, v){ const T = d && tl && PLACES[d] && PLACES[d][tl]; if (!T || !v) return ''; for (const h in T) if (T[h].includes(v)) return h; return ''; }

/* --- crops from the server's CropRef */
function applyBoot(b){
  for (const k in CROPS) delete CROPS[k]; for (const k in WASTE_BASE) delete WASTE_BASE[k];
  (b.crops||[]).forEach(c => {
    const units = String(c.units||'Kg').toLowerCase().split(',').map(s => s.trim()).filter(Boolean), su = String(c.seed_units||'Kg').toLowerCase().split(',').map(s => s.trim());
    CROPS[c.code] = {unit:units[0], units, days:+c.h_start||60, hEnd:+c.h_end||+c.h_start||60, base:+c.price_normal||0, seedPerAcre:+c.seed_kg_acre||0, plantsPerAcre:+c.plants_acre||0,
      perTray:+c.per_tray||0, drift:[0], lab:units[0], sunit:su.includes('kg')?'kg':(su.includes('tray')?'tray':'kg'), yieldAcre:+c.yield_acre||0};
    D[c.code] = {kn:c.kn||c.en||c.code, en:c.en||c.kn||c.code, mr:c.mr||c.en||c.kn||c.code, hi:c.hi||c.en||c.kn||c.code};
    if (c.waste_pct != null) WASTE_BASE[c.code] = +c.waste_pct;
  });
  if (!Object.keys(CROPS).length) { CROPS.COR = {unit:'bundle', units:['bundle'], days:40, hEnd:49, base:0, seedPerAcre:10, plantsPerAcre:0, drift:[0], lab:'bundle', sunit:'kg'}; D.COR = D.COR || {kn:'ಕೊತ್ತಂಬರಿ ಸೊಪ್ಪು', en:'Coriander', mr:'कोथिंबीर', hi:'धनिया'}; }
  VARS = {}; (b.varieties||[]).forEach(v => (VARS[v.crop] = VARS[v.crop] || []).push({id:v.id, name:v.name, new:v.new}));
  if (!CROPS[S.crop]) S.crop = Object.keys(CROPS)[0];
  applyLocal();
}

/* --- forecast summary (made by the server every few hours) */
let FC = {}, SUMMARY = null;
const weekOf = d => addDays(d, -d.getDay());                 // weeks start on Sunday
function fcFrom(sum){ FC = {}; ((sum && sum.forecast) || []).forEach(f => { const d = parseDMY(f.week); if (d) (FC[f.crop] = FC[f.crop] || []).push({date:d, price:+f.mid, low:+f.low, high:+f.high, ratio:f.ratio==null?null:+f.ratio, conf:f.conf}); }); }
function forecastFor(c){ const L = (FC[c]||[]).filter(p => p.price > 0 && p.date >= addDays(TODAY,-6)); if (L.length >= 2) return L.slice(0, 8);
  const b = (CROPS[c]||{}).base || 0; return [{date:new Date(TODAY), price:b, est:true}, {date:addDays(TODAY,7), price:b, est:true}]; }
const fcAt = (c, d) => { const w = +weekOf(d); return (FC[c]||[]).find(p => +p.date === w) || null; };
function realOutlook(crop, sow){ const C = CROPS[crop]||{}, h = addDays(sow, C.days||60), f = fcAt(crop, h), exp = Math.round(f ? f.price : (C.base||0)), r = (C.base>0 && f) ? f.price/C.base : 1;
  return {harv:h, exp, cat:r>=1.08?'g':r<=0.92?'l':'m'}; }
function sowWeeks(c){ const C = CROPS[c]; if (!C) return []; const s0 = addDays(weekOf(TODAY), 7), out = [];
  for (let k = 0; k < 5; k++) { const sow = addDays(s0, 7*k), f = fcAt(c, addDays(sow, C.days)); if (!f || f.ratio == null) continue;
    out.push({date:sow, room:Math.round((1-f.ratio)*100), pct:true, st:f.ratio<0.9?'open':f.ratio<=1.1?'bal':'over'}); }
  const open = out.filter(x => x.st==='open'); if (open.length) open.reduce((a,b) => b.room > a.room ? b : a).best = true; return out; }

/* --- server rows -> the screen's shapes */
function prevFrom(p){
  const a = fromIso(p.from_date), r = {kind:p.kind, crop:p.crop_code, per:p.per, year:a.getFullYear(), month:a.getMonth()+1, _cid:p.client_id};
  if (p.per==='day') r.date = a;
  if (p.per==='week') { const i = weeksOfMonth(r.year, r.month).findIndex(w => +w[0] === +a); r.weekNo = p.week_no || (i+1) || 1; }
  if (p.per==='fortnight') r.half = p.half || (a.getDate() > 15 ? 2 : 1);
  if (p.kind==='sow') r.area = +p.area_gunta; else { r.qty = +p.qty; r.unit = p.unit; if (p.size) r.size = p.size; if (p.crate_kg) r.crate = +p.crate_kg; if (p.bag_size != null) r.bagSize = +p.bag_size; }
  if (p.price) r.price = +p.price; if (p.cover_gunta) r.cover = +p.cover_gunta; if (p.est_cover_gunta) r.estCover = +p.est_cover_gunta;
  if (LINEDK.includes(p.kind)) Object.assign(r, placeNames(p));
  if (p.kind === 'stockin') r.supName = p.seed_source === 'own' ? t('x_src_own') : (p.sup_name || '');
  return r;
}
const condIn = {Good:'good', Medium:'avg', Low:'poor'}, condOut = {good:'Good', avg:'Medium', poor:'Low'};

  OB.get().filter(i => i.type==='prev' && i.data.role===role && !out.prev.some(x => x._cid===i.client_id)).forEach(i => out.prev.unshift(prevFrom(Object.assign({client_id:i.client_id}, i.data))));

    out.plans = P.filter(p => p.status==='Planned').map(p => { const sd = fromIso(p.plan_date); return Object.assign({id:p.cid||p.id, crop:p.crop, plot:p.plot||1, sow:sd, variety:p.variety}, ac(+p.area_gunta), realOutlook(p.crop, sd)); });

      return Object.assign({id:p.cid||p.id, crop:p.crop, plot:p.plot||1, sown:sd, days:(CROPS[p.crop]||{}).days||60, cat:o.cat, exp:o.exp, variety:p.variety,
        cond:c ? {growth:condIn[c.condition]||'avg', damage:!!c.damaged, reason:c.cause||'', loss:+c.damage_pct||0, upd:fromIso(c.date)} : null}, ac(+p.area_gunta)); });

      const p = out.plans.splice(k, 1)[0], sd = fromIso(i.data.sow_date), o = realOutlook(p.crop, sd);
      out.crops.push(Object.assign({id:p.id, crop:p.crop, plot:p.plot, sown:sd, days:(CROPS[p.crop]||{}).days || 60, cat:o.cat, exp:o.exp, variety:i.data.variety_name || p.variety, cond:null}, ac(+i.data.area_gunta || (p.acre*40 + p.gunta)))); });

/* --- screen forms -> outbox entries */
function spanOfRec(r){
  const d = r.date instanceof Date ? r.date : parseDMY(r.date);
  if (r.per==='day') return [d, d];
  if (r.per==='fortnight') return fnSpan(r.year, r.month, r.half);
  if (r.per==='month') return [new Date(r.year, r.month-1, 1), new Date(r.year, r.month, 0)];
  const w = weeksOfMonth(r.year, r.month)[(r.weekNo||1)-1]; return [w[0], w[1]];
}
const qtyBits = (unit, size, crate) => ({unit, size:unit==='bundle' ? (size||'medium') : null, crate_kg:unit==='crate' ? (+crate||null) : null});

  const L = VARS[F.crop] = VARS[F.crop] || [], hit = L.find(v => vkey(v.name) === vkey(nm)); if (hit) return hit.name;
  const det = {}; vFields(F).forEach(f => { if (+F['vd_'+f] > 0) det[f] = +F['vd_'+f]; });
  items.push({type:'rpc', client_id:uuid(), rpc:'bb_add_variety', args:{p_crop:F.crop, p_name:nm, p_role:S.role, p_details:det, p_company:null}});

}

/* --- the same calls as the demo, on the real server */
const SaveFailed = new Error('saved:no');
async function sendNow(items){
  OB.add(items); if (!navigator.onLine) return {queued:true};
  const errs = await Promise.race([OB.flush(true), wait(8000).then(() => null)]);
  if (errs === null) return {queued:true};
  const mine = (errs||[]).find(e => items.some(i => i.client_id === e.client_id));
  if (mine) { toast(errText(mine.err), 'bad'); throw SaveFailed; }      // the screen stays open to correct the entry
  return OB.get().some(x => items.some(i => i.client_id === x.client_id)) ? {queued:true} : {ok:true};
}

/* --- start: sign in this phone, read crops / places, open the saved session */
async function realBoot(){
  S.screen = 'boot'; render();
  let b = null; try { b = await SB.rpc('bb_bootstrap'); store.set('bb_boot', b); } catch(e) { b = store.get('bb_boot'); }
  if (b) {
    applyBoot(b);
    SB.rpc('bb_crop_local').then(x => { if (x && JSON.stringify(x) !== JSON.stringify(CLOCAL)) { CLOCAL = x; store.set('bb_clocal', x); applyLocal(); render(); } }).catch(() => {});
    SB.rpc('bb_var_prem').then(x => { if (x && JSON.stringify(x) !== JSON.stringify(VPREM)) { VPREM = x; store.set('bb_vprem', x); render(); } }).catch(() => {});
    SB.rpc('bb_texts').then(x => { if (x && JSON.stringify(x) !== JSON.stringify(store.get('bb_text'))) { store.set('bb_text', x); applyTexts(x); render(); } }).catch(() => {});
    let pl = null; try { pl = await Promise.all((b.districts||[]).map(d => SB.rpc('bb_places', {p_district:d.code}))); store.set('bb_places', pl); } catch(e) { pl = store.get('bb_places'); }
    applyPlaces(pl || []);
    S.screen = 'login';
    if (b.me && b.me.user && !store.get('bb_out')) { const r = userResult(b.me); if (r.ok) { afterLogin(r); OB.flush(); setInterval(() => OB.flush(), 60000); return; } }
  } else { S.screen = 'login'; applyBoot({crops:[]}); setTimeout(() => toast(t('x_eNet'), 'bad'), 300); }
  render(); OB.flush(); setInterval(() => OB.flush(), 60000);
}

function bindLogin(){ const m = $('#mob'); if (m) { liveMob(m); m.focus(); } const cb = $('#codeb'); if (cb) { const ins = [...cb.querySelectorAll('input')]; ins.forEach((el,i) => { el.addEventListener('input', () => { el.value = el.value.replace(/\D/g,''); if (el.value && ins[i+1]) ins[i+1].focus(); if (ins.every(x=>x.value)) doVerify(); }); el.addEventListener('keydown', e => { if (e.key==='Backspace' && !el.value && ins[i-1]) ins[i-1].focus(); }); }); ins[0].focus(); } }

  const code = [...document.querySelectorAll('#codeb input')].map(i=>i.value).join('');

  if (r.user.roles.length>1) { S.screen = 'chooser'; } else { S.role = r.user.roles[0]; enterHome(); return; }
  render();
}

function linesCheck(withCover){

/* seed / seedling -> expected area (acres), same rule as the server (CropParams SeedPerAcre / PlantsPerAcre) */
function lineUnit(){ const F = S.f; return F.form==='sale' ? {unit:F.sunit, bag:+F.sbs||0} : {unit:F.punit, bag:+F.ybs||0}; }
function impliedAcres(q){ const F = S.f, c = CROPS[F.crop]||{}, u = lineUnit(); q = +q||0; if (!q) return 0;
  if (u.unit==='kg' && c.seedPerAcre) return q/c.seedPerAcre;
  if (u.unit==='bag' && u.bag && c.seedPerAcre) return q*u.bag/c.seedPerAcre;
  if (u.unit==='tray' && u.bag && c.plantsPerAcre) return q*u.bag/c.plantsPerAcre;
  if (u.unit==='number' && c.plantsPerAcre) return q/c.plantsPerAcre;
  return 0; }

  return (c.bad ? `<span class="bad">⚠ ${t(c.hi?'x_covHi':'x_covLo')}</span><br>` : '') + `${t('x_covExp',{a:acTxt(c.imp), lo:acTxt(lo), hi:acTxt(hi)})}${c.g?'':' · '+t('x_covBlank')}`; }

function moveWhen(){ // -> {r:{per,date|year,month,weekNo,half}, a:start, b:end} or {err:[id,msg]}
  const F = S.f, exp = F.mtype==='expected', T0 = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate()), M0 = new Date(T0.getFullYear(), T0.getMonth(), 1);
  let a, b; const r = {per:F.mper};
  if (F.mper==='day') { const d = parseDMY(F.mdt); if (!d) return {err:['mdt',t('badDate')]}; a = b = d; r.date = F.mdt; }
  else { const y = +F.myear, m = +F.mmon; if (!m) return {err:['mmon',t('x_pickMonth')]}; r.year = y; r.month = m;
    if (F.mper==='month') { a = new Date(y,m-1,1); b = new Date(y,m,0); }
    else if (F.mper==='week') { if (!F.mwk) return {err:['mwk',t('x_pickWeek')]}; [a,b] = weeksOfMonth(y,m)[+F.mwk-1]; r.weekNo = +F.mwk; }
    else { if (!F.mhalf) return {err:['mhalf',t('x_pickHalf')]}; [a,b] = fnSpan(y,m,F.mhalf); r.half = +F.mhalf; } }
  const errId = F.mper==='day' ? 'mdt' : F.mper==='week' ? 'mwk' : F.mper==='fortnight' ? 'mhalf' : 'mmon';
  if (!exp && a > T0) return {err:[errId, t('x_future')]};
  if (!exp && (F.mper==='month'||F.mper==='fortnight') && b >= M0) return {err:[errId, t('x_mvCurRule')]};
  if (exp && b < T0) return {err:[errId, t('x_mvExpPast')]};
  return {r, a, b};
}

async function saveHarvest(el){
  const F = S.f; let ok = true; const d = parseDMY(F.date); const q = +F.qty, p = +F.price;

  if (!(q>0)) { setMsg('hqty','e',t('x_qty0')); ok = false; }
  if (!(p>0)) { setMsg('hprice','e',t('x_price0')); ok = false; }
  if (!ok) { shake(); return; }
  // flags (warn, ask to press again)
  const mkt = S.data?.forecast[F.crop]?.[0]?.price; const kg = stdKg(); const perUnit = F.unit==='crate' ? p/(+F.crate||1) : p;
  let warned = false;
  if (kg && kg > 6000) { setMsg('hqty','w',t('x_hiYield')); warned = true; }
  if (F.unit==='bundle' && q > 3000) { setMsg('hqty','w',t('x_hiYield')); warned = true; }
  if (mkt && F.unit!=='number' && (perUnit > mkt*2.2 || perUnit < mkt*0.35)) { setMsg('hprice','w',t('x_priceOff')); warned = true; }

  const rec = {crop:F.crop, date:fd(d), unit:F.unit, size:F.size, crate:F.crate, qty:q, price:p, kg};
  const r = await busy(el, () => API.saveHarvest(rec));
  if (S.data && S.data.harv) { const u = F.unit==='crate' ? 'kg' : F.unit; const add = F.unit==='crate' ? kg : q; const pu = F.unit==='crate' ? p/(+F.crate||1) : p; const h = S.data.harv[F.crop] || {qty:0, unit:u, avg:0, best:0, n:0};
    h.avg = (h.avg*h.qty + pu*add)/(h.qty+add); h.qty += add; h.best = Math.max(h.best, pu); h.n += 1; S.data.harv[F.crop] = h; }

  else { if (!F.pmonth) return {err:['ymo',t('x_pickMonth')]}; r.year = +F.pyear; r.month = +F.pmonth; if (new Date(r.year, r.month-1, 1) >= S.user.reg) return {err:['ymo',t('x_before',{d:fd(S.user.reg)})]};

async function savePrev(el){
  const F = S.f, k = F.pkind, stk = k==='stockin', seed = SEEDK.includes(k) || stk, lined = LINEDK.includes(k), cover = COVERK.includes(k), hasP = PRICEK.includes(k); const w = prevWhenFromForm(); let ok = true;
  if (w.err) { setMsg(w.err[0],'e',w.err[1]); ok = false; }
  if (!pyC(F.crop)) { setMsg('ycrop','e',t('x_pickCrop')); shake(); return; }
  const q = +F.yq, p = +F.ypr, unit = seed ? F.punit : F.unit, A = totGunta(F.yaac, F.yagu);
  if (k==='sow') { if (!A) { setMsg('ya','e',t('x_area0')); ok = false; } else if (+F.yagu>39) { setMsg('ya','e',t('gu')+' 0–39'); ok = false; } }
  else if (!lined) { if (!(q>0)) { setMsg('yq','e',t('x_qty0')); ok = false; } }
  if (!seed && k!=='sow' && unit==='crate' && !F.crate) { setMsg('crate','e',t('crateSize')); ok = false; }
  if (seed && unit!=='kg' && unit!=='g' && !(+F.ybs>0)) { setMsg('ybs','e',t('x_qty0')); ok = false; }
  if (stk && !varCheck()) ok = false;
  if (stk && !supCheck()) ok = false;
  if (hasP && !(p>0)) { setMsg('ypr','e',t('x_price0')); ok = false; }
  if (lined && !linesCheck(cover)) ok = false;
  if (!ok) { shake(); return; }
  const common = Object.assign({kind:k, crop:F.crop, batch:uuid()}, w.r, seed ? {unit, bagSize:(unit==='kg'||unit==='g')?0:+F.ybs} : k==='sow' ? {area:A} : {unit}, (!seed && k!=='sow') ? {size:unit==='bundle'?F.size:'', crate:unit==='crate'?+F.crate:''} : {}, hasP ? {price:p} : {});
  if (stk) { const L = (F.supList || []).find(x => x.key === F.sup); Object.assign(common, {ssrc:F.ssrc, vname:F.vname, sup:supItemData(F), supName:F.ssrc === 'own' ? t('x_src_own') : F.sup === 'new' ? String(F.snm).trim() : (L ? L.name : '')}); }
  const recs = lined ? F.lines.map(L => Object.assign({}, common, lineRec(L), {qty:+L.q}, cover ? {cover:totGunta(L.ac,L.gu), estCover:Math.round(impliedAcres(L.q)*40)} : {})) : [Object.assign(common, k==='sow' ? {} : {qty:q})];
  let warn = '';

  const base = (pyC(F.crop) || {}).base || 0, pu = unit==='crate' ? p/(+F.crate||1) : p;
  if (!warn && base && hasP && unit!=='number' && (pu>base*4 || pu<base*0.25)) { warn = 'x_prevPrice'; setMsg('ypr','w',t(warn)); }
  if (warn && !F.confirmed) { F.confirmed = true; el.textContent = t('x_sumSave')+' ✓'; return; }
  await busy(el, async () => { for (const r of recs) await API.saveRec(r); });
  if (S.pyInfo) S.pyInfo.with_data = [...new Set([...(S.pyInfo.with_data || []), F.crop])];
  if (lined) rememberAreas(F.lines);
  recs.slice().reverse().forEach(r => S.data.prev.unshift(r));
  el.classList.add('done'); el.textContent = '✓ '+t('saved')+(recs.length>1?' ('+recs.length+')':''); savedToast(); setTimeout(() => { closeSheet(); render(); }, 700);
}

/* ---- quantities on the sowing page: bought (date, qty) and sown / planted */
const qUnits = () => S.f.atype === 'transplant' ? ['tray','number'] : ['kg','g'];
function sownNormal(p){                                       // normal quantity for the sown area in the chosen unit, or 0
  const C = CROPS[p.crop] || {}, ac = totGunta(S.f.aaac, S.f.aagu) / 40, u = S.f.qu; if (!(ac > 0)) return 0;
  if (u === 'kg') return C.seedPerAcre > 0 ? C.seedPerAcre * ac : 0;
  if (u === 'g') return C.seedPerAcre > 0 ? C.seedPerAcre * ac * 1000 : 0;
  if (u === 'number') return C.plantsPerAcre > 0 ? C.plantsPerAcre * ac : 0;
  if (u === 'tray') { const pt = +S.f.ptray > 0 ? +S.f.ptray : C.perTray; return C.plantsPerAcre > 0 && pt > 0 ? C.plantsPerAcre * ac / pt : 0; }
  return 0; }
const rnd = x => x >= 100 ? Math.round(x) : Math.round(x * 10) / 10;
function qtyBlock(p){
  const F = S.f; if (!qUnits().includes(F.qu)) F.qu = qUnits()[0];
  const n = sownNormal(p), u = t('x_un_' + F.qu);
  return `<div class="card lcard" style="margin-bottom:14px">
   <div class="field"><span class="lab">${t('x_qUnit')}</span>${chipRow('qu', qUnits(), F.qu, v => t('x_un_' + v))}</div>
   ${F.ssrc === 'bought' ? field('bdt', t('x_buyDate'), `<input id="bdt" data-g="bdt" data-ty="date" inputmode="numeric" maxlength="10" placeholder="DD-MM-YYYY" value="${esc(F.bdt || '')}">`)
       + numIn('bq', t(isTp(F) ? 'x_buyQtyT' : 'x_buyQtyS') + ' (' + u + ')') : ''}
   ${numIn('aq', t(isTp(F) ? 'x_sownQtyT' : 'x_sownQtyS') + ' (' + u + ')', {ph: n ? String(rnd(n)) : '0'})}
   ${F.qu === 'tray' ? numIn('ptray', t('x_perTray') + ' *', {ph: (CROPS[p.crop]||{}).perTray ? t('x_eg') + ' ' + CROPS[p.crop].perTray : '98'}) : ''}
   <div class="sub" id="sownNorm" style="margin:-8px 0 4px">${n ? t('x_sownNorm', {n:rnd(n), u}) : ''}</div>
   ${F.qu === 'tray' ? `<div class="sub" id="trayTot" style="margin:4px 0">${trayTot()}</div>` : ''}</div>`; }
/* trays -> seedlings: the farmer gives the seedlings in one tray */
function trayTot(){ const F = S.f, pt = +F.ptray; if (!(pt > 0)) return t('x_perTrayWhy');
  return [+F.bq > 0 && F.ssrc === 'bought' ? t('x_trayBuyTot', {n:Math.round(+F.bq * pt)}) : '', +F.aq > 0 ? t('x_trayTot', {n:Math.round(+F.aq * pt)}) : ''].filter(Boolean).join(' · ') || t('x_perTrayWhy'); }
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.g; if (!['aq','bq','ptray','aaac','aagu'].includes(k) || !S.f || S.f.form !== 'act') return;
  const x = document.getElementById('trayTot'); if (x) x.textContent = trayTot();
  const p = S.data && S.data.plans.find(y => String(y.id) === String(S.f.planId)), m = document.getElementById('sownNorm');
  if (p && m) { const n = sownNormal(p); m.textContent = n ? t('x_sownNorm', {n:rnd(n), u:t('x_un_' + S.f.qu)}) : ''; }
  if (k === 'ptray') setMsg('aq', '', ''); });
function qtyCheck(p){
  const F = S.f, sow = parseDMY(F.adt); let ok = true;
  if (F.ssrc === 'bought') {
    const b = parseDMY(F.bdt || '');
    if (!b) { setMsg('bdt', 'e', t('badDate')); ok = false; }
    else if (sow && (b > sow || b < addDays(sow, -400))) { setMsg('bdt', 'e', t('x_eBuyDate')); ok = false; }
    if (!(+F.bq > 0)) { setMsg('bq', 'e', t('x_eQty')); ok = false; }
  }
  if (F.qu === 'tray') { const pt = +F.ptray, nt = (CROPS[p.crop]||{}).perTray || 0;
    if (!(pt > 0) || pt !== Math.round(pt)) { setMsg('ptray', 'e', t('x_ePerTray')); ok = false; }
    else if (nt ? (pt >= nt * 2 || pt <= nt / 2) : (pt < 10 || pt > 1000)) { setMsg('ptray', 'e', t('x_eRange', {f:t('x_perTray'), n:nt || 98})); ok = false; } }
  const q = +F.aq, n = sownNormal(p);
  if (!(q > 0)) { setMsg('aq', 'e', t('x_eQty')); ok = false; }
  else if (n && (q >= n * 2 || q <= n / 2)) { setMsg('aq', 'e', t('x_eSownQty', {n:rnd(n), u:t('x_un_' + F.qu)})); ok = false; }
  return ok; }
function supCheck(){                                         // returns false (with messages) when something is missing
  const F = S.f; let ok = true;
  if (!F.ssrc) { setMsg('ssrc', 'e', t('x_pickSrc')); return false; }
  if (F.ssrc !== 'bought') return true;
  if (supUp() ? !F.spd : !F.spv) { setMsg('sp', 'e', t(supUp() ? 'x_upPlaceFirst' : 'x_supTaluk')); return false; }
  if (!F.sup) { setMsg('sup', 'e', t('x_supPick')); return false; }
  if (F.sup === 'new') {
    const nm = String(F.snm || '').trim();
    if (nm.length < 2 || nm.length > 80) { setMsg('snm', 'e', t('x_eName')); ok = false; }
    else { const hit = (F.supList || []).find(s => vkey(s.name) === vkey(nm)); if (hit) { F.sup = hit.key; toast(t('x_supExists'), ''); keepSheetScroll(reopen); return false; } }
  }
  return ok;
}
function supItemData(F){                                     // fields for the sowing entry
  if (F.ssrc !== 'bought') return {seed_source:F.ssrc};
  const d = Object.assign({seed_source:'bought'}, placeIds(F.spd, F.sptl, F.sph, F.spv, 'sup_'));
  const pick = F.sup === 'new' ? null : (F.supList || []).find(s => s.key === F.sup);
  if (F.sup === 'new' || (pick && pick.local)) {
    const n = pick ? pick.local : {client_id:uuid(), name:String(F.snm).trim(), shop:String(F.sshop || '').trim(), kind:F.skind || UP_ROLES[supUp() || 'Farmer'][0]};
    d.supplier_new = n;
    if (!pick) { const c = supCache(), L = c[F.supKey] || []; L.push({key:'n:local-' + n.client_id, name:n.name, shop:n.shop, kind:n.kind, new:true, local:n}); supRemember(F.supKey, L); }
  } else if (pick && pick.key.startsWith('u:')) d.supplier_user = pick.key.slice(2);
  else if (pick && pick.key.startsWith('n:')) d.supplier_id = pick.key.slice(2);
  return d;
}

      + (ph.length ? `<div class="lockline" style="margin-bottom:12px">${svg('warn')}<span>${esc(t('x_txPh', {p:ph.join('  ')}))}</span></div>` : '')
      + TXL.map(l => field('tx_'+l, TXN[l], `<textarea id="tx_${l}" rows="2" lang="${l}">${esc(D[k][l] || '')}</textarea>`)
        + `<div class="sub" style="margin:-8px 0 14px">${t('x_txDef')}: ${esc(D0[k][l]||'')}</div>`).join('')
      + `<div class="msg" id="m_tx" role="alert"></div><div class="lgrid"><button class="btn ghost" data-a="txBack">${t('back')}</button>${btn(t('save'),'txSave','mari','id="bTx"')}</div>`
      + (txChanged(k) ? `<button class="btn ghost" data-a="txSave" data-v="reset" style="margin-top:10px;color:var(--low)">${t('x_txReset')}</button>` : ''));
    return; }
  const nch = Object.keys(D0).filter(txChanged).length;
  openSheet(sheetHead(t('x_txT')) + `<p class="mute" style="margin:-4px 0 12px">${t('x_txWhy')}</p>`
    + `<div class="inp" style="margin-bottom:10px">${svg('search','style="width:20px;height:20px;flex:none;opacity:.6;margin-right:8px"')}<input id="txq" placeholder="${esc(t('x_txSearch'))}" value="${esc(F.tq||'')}" autocomplete="off"></div>`
    + `<div class="chips" style="margin-bottom:12px"><button type="button" class="chip sm2" data-a="txCh" data-v="" aria-pressed="${!F.tch}">${t('x_txAll')}</button><button type="button" class="chip sm2" data-a="txCh" data-v="1" aria-pressed="${!!F.tch}">${t('x_txChanged')} (${nch})</button></div>`
    + `<div id="txl">${txList()}</div>`);
  const q = document.getElementById('txq'); if (q) q.addEventListener('input', () => { F.tq = q.value; const l = document.getElementById('txl'); if (l) l.innerHTML = txList(); }); }
async function txSave(el, reset){ const k = S.f.tkey, vals = {}; TXL.forEach(l => { const x = document.getElementById('tx_'+l); vals[l] = x ? x.value.trim() : ''; });
  if (!reset) { const E = txCheck(k, vals); if (E.length) { setMsg('tx', 'e', E.join(' · ')); shake(); return; } }
  const r = await busy(el, () => API.textSet(k, vals, reset));
  if (!r || r.err) { setMsg('tx', 'e', r && r.err && r.err !== 'net' ? r.err.replace(/^E:text:/, '') : t('x_eNet')); return; }
  store.set('bb_text', r); applyTexts(r); applyLocal(); S.f.tkey = ''; render(); vTexts(); toast(t('x_txSaved'), 'good'); }

/* after "save": saved on the server, or kept on the phone (no / weak internet) */
function savedToast(){ const fresh = pendAll().some(i => Date.now() - (i.at || 0) < 20000); toast(t(fresh ? 'x_offline' : 'saved'), fresh ? 'bad' : 'good'); }
/* ---- entries still on this phone (typed without internet / weak internet) */
function vPending(){ const L = pendItems().slice().reverse();
  openSheet(sheetHead(t('x_pendT')) + `<p class="mute" style="margin:-4px 0 12px">${t(NET.st === 'off' ? 'x_net_offTip' : NET.st === 'weak' ? 'x_net_weakTip' : 'x_pendWhy')}</p>`
    + (L.length ? `<div class="card list">${L.map(i => { const x = pendDesc(i);
        return `<div class="listrow" style="cursor:default;align-items:flex-start"><span style="min-width:0;flex:1"><b style="display:block">${esc(x.title)}</b>${x.detail ? `<span class="sub" style="display:block">${esc(x.detail)}</span>` : ''}<span class="sub" style="display:block">${t('x_pendAt')}: ${esc(x.at)}</span></span><span class="pill l" style="font-size:12px;padding:2px 9px;flex:none">${t('x_pendTag')}</span></div>`; }).join('')}</div>`
      : `<div class="lockline">${svg('check')}<span>${t('x_pendNone')}</span></div>`)
    + (L.length && NET.st !== 'off' ? `<div style="margin-top:14px">${btn(t('x_sendNow'), 'flushNow', 'mari')}</div>` : '')); }

/* ---- facilitators: a suggestion on anything about the project; the admin reads and replies */
const SG_TOPICS = ['app','price','farmer','words','new','other'];
const sgPill = st => `<span class="pill ${st==='Done'?'g':st==='Seen'?'m':'l'}" style="font-size:12px;padding:2px 10px">${t('x_sg_'+st)}</span>`;
const sgWhen = x => { const d = new Date(x.at); return isNaN(d) ? '' : fd(d); };
function vSuggest(){ const F = S.f;
  if (F.mine === undefined) { F.mine = null; API.sgMine().then(r => { F.mine = r || []; if (S.f === F) keepSheetScroll(vSuggest); }); }
  openSheet(sheetHead(t('x_sgT')) + `<p class="mute" style="margin:-4px 0 14px">${t('x_sgWhy')}</p>`
    + `<div class="field"><span class="lab">${t('x_sgTopic')} *</span><div class="chips">${SG_TOPICS.map(k => `<button type="button" class="chip sm2" data-a="sgTopic" data-v="${k}" aria-pressed="${F.sgt===k}">${t('x_sg_'+k)}</button>`).join('')}</div><div class="msg" id="m_sgt" role="alert"></div></div>`
    + field('sgm', t('x_sgMsg')+' *', `<textarea id="sgm" rows="5" maxlength="1000" data-sg="1">${esc(F.sgm||'')}</textarea>`)
    + btn(t('x_sgSend'), 'sgSend', 'mari', 'id="bSg"')
    + `<div class="sechead" style="margin-top:20px"><h3>${t('x_sgMine')}</h3></div>`
    + (F.mine === null ? '<div class="skel"></div>' : F.mine.length ? F.mine.map(x => `<div class="card" style="margin-bottom:10px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="flex:1">${t('x_sg_'+(x.topic||'other'))}</b>${x.pending ? `<span class="pill m" style="font-size:12px;padding:2px 10px">${t('x_sgPending')}</span>` : sgPill(x.status)}</div>
        <div class="sub">${sgWhen(x)}</div><p style="margin:6px 0 0;white-space:pre-wrap">${esc(x.message)}</p>
        ${x.reply ? `<div class="lockline" style="margin-top:10px">${svg('check')}<span><b>${t('x_sgReply')}:</b> ${esc(x.reply)}</span></div>` : ''}</div>`).join('') : `<p class="mute">${t('x_sgNone')}</p>`)); }
async function sgSend(el){ const F = S.f, m = (F.sgm||'').trim(); let ok = true;
  if (!F.sgt) { setMsg('sgt', 'e', t('x_sgTopicReq')); ok = false; }
  if (m.length < 10) { setMsg('sgm', 'e', t('x_sgShort')); ok = false; }
  if (!ok) { shake(); return; }
  let r; try { r = await busy(el, () => API.sgSend(F.sgt, m)); } catch(x) { return; }
  (F.mine = F.mine || []).unshift({topic:F.sgt, message:m, status:'New', at:new Date().toISOString(), pending:!!(r && r.queued)});
  F.sgm = ''; F.sgt = ''; toast(t(r && r.queued ? 'x_sgQueued' : 'x_sgSent'), 'good'); keepSheetScroll(vSuggest); }
function vSgAdmin(){ const F = S.f;
  if (!F.rows) { openSheet(sheetHead(t('x_sgAdmT')) + '<div class="skel"></div>'); API.sgAdmin().then(r => { F.rows = r || []; if (S.f === F) keepSheetScroll(vSgAdmin); }); return; }
  const st = F.sgf || 'New', L = F.rows.filter(x => st === 'all' || x.status === st), n = k => F.rows.filter(x => x.status === k).length;
  openSheet(sheetHead(t('x_sgAdmT'))
    + `<div class="chips" style="margin-bottom:12px">${['New','Seen','Done','all'].map(k => `<button type="button" class="chip sm2" data-a="sgF" data-v="${k}" aria-pressed="${st===k}">${k==='all' ? t('x_txAll')+' ('+F.rows.length+')' : t('x_sg_'+k)+' ('+n(k)+')'}</button>`).join('')}</div>`
    + (L.length ? L.map(x => `<div class="card lcard" style="margin-bottom:12px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="flex:1">${esc(x.name||'')}</b>${sgPill(x.status)}</div>
        <div class="sub">${esc([pnm(x.village||''), pnm(x.taluk||'')].filter(Boolean).join(', '))}${x.mobile ? ` · <a href="tel:${esc(x.mobile)}">${esc(x.mobile)}</a>` : ''} · ${sgWhen(x)}</div>
        <div style="margin-top:6px"><span class="pill m" style="font-size:12px;padding:2px 10px">${t('x_sg_'+(x.topic||'other'))}</span></div>
        <p style="margin:8px 0 10px;white-space:pre-wrap">${esc(x.message)}</p>
        ${x.reply ? `<div class="lockline" style="margin-bottom:10px">${svg('check')}<span><b>${t('x_sgReply')}:</b> ${esc(x.reply)}</span></div>` : ''}
        ${x.status !== 'Done' ? `<div class="inp" style="margin-bottom:10px"><textarea id="sgr_${esc(x.id)}" rows="2" maxlength="1000" placeholder="${esc(t('x_sgReplyPh'))}"></textarea></div>
        <div class="msg" id="m_sgr${esc(x.id)}" role="alert"></div>
        <div class="lgrid">${x.status === 'New' ? `<button class="btn ghost" data-a="sgAct" data-v="Seen|${esc(x.id)}">${t('x_sgSeenBtn')}</button>` : '<span></span>'}<button class="btn mari" data-a="sgAct" data-v="Done|${esc(x.id)}">${t('x_sgDoneBtn')}</button></div>` : ''}</div>`).join('')
      : `<p class="mute">${t('x_sgNone')}</p>`)); }
async function sgAct(el, v){ const [st, id] = v.split('|'), F = S.f, x = (F.rows||[]).find(y => String(y.id) === id); if (!x) return;
  const ta = document.getElementById('sgr_'+id), reply = ta ? ta.value.trim() : '';
  const r = await busy(el, () => API.sgReply(x.id, reply, st)); if (!r || r.err) { setMsg('sgr'+id, 'e', t('x_eNet')); return; }
  x.status = st; if (reply) x.reply = reply; toast(t('saved'), 'good'); keepSheetScroll(vSgAdmin); }
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.sg && S.f) { S.f.sgm = e.target.value; setMsg('sgm', '', ''); } });

function newForm(kind){ S.f = {form:kind, crop:S.crop, date:fd(TODAY), unit:CROPS[S.crop].unit, size:'medium', crate:'', qty:'', price:'', lp:'', hp:'', confirmed:false, plot:1, paac:'', pagu:'', pdt:'', adt:fd(TODAY), atype:'sowing', rest:'', ci:0, growth:'', dam:'no', reason:'', closs:'', period:'day', sdt:fd(TODAY), sunit:(CROPS[S.crop]&&CROPS[S.crop].sunit)||(S.crop==='Coriander'?'kg':'tray'), sq:'', sbs:'98', scac:'', scgu:'', pkind:(PREV_KINDS[S.role]||[]).length>1 ? '' : (PREV_KINDS[S.role]||[''])[0], pper:'week', pyear:new Date((S.user&&S.user.reg||TODAY).getFullYear(), (S.user&&S.user.reg||TODAY).getMonth()-1, 1).getFullYear(), pmonth:'', pweek:'', ydt:'', yq:'', ypr:'', ybs:'98', yaac:'', yagu:'', ycac:'', ycgu:'', punit:'kg', lines:[newLine()]}; }
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return; const a = el.dataset.a, v = el.dataset.v;
  switch(a){
    case 'lang': LANG = v; store.set('lang', v); try{localStorage.setItem('lang', v)}catch(x){} { const open = $('#sheetBack'); closeSheet(); render(); } break;
    case 'login': doLogin(el); break;
    case 'verify': doVerify(); break;
    case 'cancelCode': S.login.needCode = false; render(); break;
    case 'toReg': S.screen = 'reg'; S.reg.step = 1; render(); break;
    case 'regBack': if (S.reg.step>1) { S.reg.step--; render(); } else { S.screen = 'login'; render(); } break;
    case 'role': S.reg.role = v; setMsg('role','',''); document.querySelectorAll('.role').forEach(b => b.setAttribute('aria-pressed', b.dataset.v===v)); break;
    case 'regNext': regNext(); break;
    case 'regFinish': if (S.reg.pending) { S.screen = 'login'; render(); } else { store.set('bb_out', false); S.user = S.reg.user; S.role = S.reg.role; enterHome(); } break;
    case 'pickrole': S.role = v; enterHome(); break;
    case 'switch': S.screen = 'chooser'; render(); break;
    case 'logout': store.set('bb_out', true); S.user = null; S.screen = 'login'; S.login = {mobile:'', needCode:false}; store.set('session', null); render(); break;
    case 'crop': S.crop = v; render(); break;
    case 'tab': S.tab = v; render(); break;
    case 'add': vAdd(); break;
    case 'closeSheet': closeSheet(); break;
    case 'open': { closeSheet(); newForm(v); if (el.dataset.id!==undefined) { if (v==='act') S.f.planId = el.dataset.id; if (v==='cond') S.f.ci = +el.dataset.id; }
      const m = {harvest:vHarvest, price:vPrice, plan:vPlan, act:vAct, cond:vCond, sale:vSale, prev:vPrev, reopen:vReopen, share:vShare, move:vMove, event:vEvent, evlist:vEvList, varrev:vVarRev, suprev:vSupRev, places:vPlaces, stock:vStock, balance:vBalance, waste:vWaste, addadmin:vAddAdmin, suggest:vSuggest, sgadmin:vSgAdmin, texts:vTexts, pending:vPending}; if (m[v]) { m[v](); bindSheetInputs(); } else if (v==='sow') vSow(); else vSoon(); } break;
    case 'pymonth': closeSheet(); newForm('prev'); S.f.pper = 'month'; S.f.pyear = +el.dataset.y; S.f.pmonth = +el.dataset.m; vPrev(); bindSheetInputs(); break;
    case 'pydel': { const r = S.data.prev[+v]; try { await API.prevDel(r); } catch(x) { break; } S.data.prev.splice(+v,1); render(); } break;
    case 'vpick': { S.f.vname = v; S.f.vsim = []; const i = $('#vname'); if (i) i.value = v; const b = $('#vnew'); if (b) b.innerHTML = varNewHtml(); } break;
    case 'varAct': varAct(el, v); break;
    case 'flushNow': if (!REAL) { if (navigator.onLine) { const n = pendN(); DB.queue = []; toast(t('x_pendDone', {n}), 'good'); } else toast(t('x_sendTry'), 'bad'); netBadge(); break; }
      OB.wait = 0; netBadge(); OB.flush(false).then(() => { if (OB.get().length) toast(t('x_sendTry'), 'bad'); netBadge(); }); setTimeout(netBadge, 50); break;
    case 'netHide': NET.hide = true; netBadge(); break;
    case 'install': if (INSTALL) { const p = INSTALL; INSTALL = null; p.prompt(); p.userChoice.then(c => { if (c.outcome === 'accepted') store.set('bb_installed', true); render(); }).catch(() => {}); } break;
    case 'instHide': store.set('bb_inst_hide', true); render(); break;
    case 'txEdit': S.f.tkey = v; vTexts(); break;
    case 'txBack': S.f.tkey = ''; vTexts(); break;
    case 'txCh': S.f.tch = v; vTexts(); break;
    case 'txSave': txSave(el, v === 'reset'); break;
    case 'sgTopic': S.f.sgt = v; setMsg('sgt', '', ''); keepSheetScroll(vSuggest); break;
    case 'sgSend': sgSend(el); break;
    case 'sgF': S.f.sgf = v; keepSheetScroll(vSgAdmin); break;
    case 'sgAct': sgAct(el, v); break;
    case 'supAct': supAct(el, v); break;
    case 'savePlaces': savePlaces(el); break;
    case 'saveStock': saveStock(el); break;
    case 'prAdd': prArr(v).push({}); prRedraw(v); break;
    case 'prDel': { const [ns, i] = v.split('|'); prArr(ns).splice(+i, 1); prRedraw(ns); } break;
    case 'pyfinish': pyFinishClick(); break;
    case 'gopy': S.screen = 'py'; render(); break;
    case 'pylater': store.set(pyLaterKey(), true); S.screen = 'home'; render(); toast(t('x_pyLaterT')); break;
    case 'pyback': S.screen = 'home'; render(); break;
    case 'pyfill': S.screen = 'py'; render(); S.pyCrop = v; newForm('prev'); vPrev(); bindSheetInputs(); break;
    case 'pyno': pyNoCrop(v); render(); break;
    case 'pyconfirm': finishPy(el); break;
    case 'fset': { const k = el.dataset.k; if (k==='mtype') { S.f.mdt = undefined; S.f.myear = ''; S.f.mmon = ''; S.f.mwk = ''; S.f.mhalf = ''; } if (k==='myear') { S.f.mwk = ''; } if (k==='crop' && S.f.form==='sale') S.f.sunit = v==='Coriander'?'kg':'tray'; if (k==='planId') { S.f.aaac = undefined; S.f.aagu = undefined; S.f.rest = ''; } if (S.f.form==='prev' && k==='crop') { S.f.unit = CROPS[v].unit; S.f.crate = ''; } if (S.f.form==='prev' && k==='pkind') { S.f.unit = CROPS[S.f.crop].unit; } if (S.f.form==='prev' && k==='pyear') { S.f.pweek = ''; } S.f.confirmed = false; S.f[k] = (k==='planId' ? v : v); reopen(); } break;
    case 'savePlan': savePlan(el); break;
    case 'saveAct': saveAct(el); break;
    case 'saveCond': saveCond(el); break;
    case 'saveSale': saveSale(el); break;
    case 'savePrev': savePrev(el); break;
    case 'doReopen': doReopen(el); break;
    case 'saveShare': saveShare(el); break;
    case 'saveMove': saveMove(el); break;
    case 'saveEvent': saveEvent(el); break;
    case 'saveWaste': saveWaste(el); break;
    case 'saveAdmin': saveAdmin(el); break;
    case 'evDecide': evDecide(el, v); break;
    case 'lnAdd': S.f.lines.push(newLine()); S.f.confirmed = false; keepSheetScroll(reopen); setTimeout(() => { const c = document.querySelectorAll('.lcard'); c[c.length-1]?.scrollIntoView({block:'center',behavior:'smooth'}); }, 60); break;
    case 'lnDel': S.f.lines.splice(+v,1); S.f.confirmed = false; keepSheetScroll(reopen); break;
    case 'lnRecent': { const r = recentAreas()[+v]; if (!r) break; let L = S.f.lines.find(x => !x.d); if (!L) { L = newLine(); S.f.lines.push(L); } Object.assign(L, {d:r.d, tl:r.tl, h:r.h, v:r.v}); S.f.confirmed = false; keepSheetScroll(reopen); } break;
    case 'hcrop': S.f.crop = v; S.f.unit = CROPS[v].unit; S.f.crate = ''; S.f.confirmed = false; vHarvest(); bindSheetInputs(); break;
    case 'pcrop': S.f.crop = v; vPrice(); bindSheetInputs(); break;
    case 'unit': S.f.unit = v; vHarvest(); bindSheetInputs(); break;
    case 'size': S.f.size = v; document.querySelectorAll('[data-a="size"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v===v)); calcHarvest(); break;
    case 'crate': S.f.crate = v; setMsg('crate','',''); document.querySelectorAll('[data-a="crate"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v===v)); calcHarvest(); break;
    case 'dset': S.f.date = fd(addDays(TODAY,+v)); { const i = $('#hdate'); i.value = S.f.date; $('#f_hdate').classList.add('ok'); setMsg('hdate','',''); } break;
    case 'step': { const i = document.getElementById(el.dataset.id); const n = Math.max(0, Math.round(((+i.value||0) + (+el.dataset.d))*100)/100); i.value = n; i.dispatchEvent(new Event('input',{bubbles:true})); } break;
    case 'saveHarvest': saveHarvest(el); break;
    case 'savePrice': savePrice(el); break;
  }
});
window.addEventListener('online', () => { if (!REAL && DB.queue.length) { const n = pendN(); DB.queue = []; toast(t('x_pendDone', {n}), 'good'); } netBadge(); OB.flush(); });
window.addEventListener('offline', () => NET.set('off'));
window.addEventListener('online', () => NET.probe());
if (navigator.connection && navigator.connection.addEventListener) navigator.connection.addEventListener('change', () => NET.probe());
setInterval(() => { if (document.visibilityState === 'visible') NET.probe(); }, 60000);
NET.probe();
document.addEventListener('visibilitychange', () => { if (!REAL) { if (document.visibilityState === 'visible') NET.probe(); return; }
  if (document.visibilityState === 'visible') { NET.probe(); OB.flush(); } else if (OB.get().length) regSync(); });   // leaving the app with entries waiting: the phone sends them later
if (REAL && 'serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data === 'bb-sent') OB.reconcile().then(netBadge); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !/claude|sandbox/.test(location.host)) navigator.serviceWorker.register('sw.js').catch(()=>{});
if (REAL) realBoot(); else render();
</script>
